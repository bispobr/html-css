<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>
        Exemplo de formulario
    </h1>

    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="idmasc" value="M"><label for="idmasc">Masculino</label>
            <input type="radio" name="sexo" id="idfem" value="F"><label for="idfem">Feenino</label>
        </fieldset>


        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esfut" id="idfut" ><label for="idfut">Futebol</label>
            <input type="checkbox" name="nata" id="idnata" ><label for="idnata">Natação</label>
            <input type="checkbox" name="basq" id="idbasq" ><label for="idbasq">Basquete</label>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
