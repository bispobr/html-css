<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <h1>teste com formulario</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="idnome">Nome</label>
            <input type="text" name="nome" id="idnome" required minlength="5" maxlength="15" size="15" placeholder="Insira seu nome" autocomplete="username">
        </p>
        <p>
            <label for="idsenha">Senha</label>
            <input type="password" name="senha" id="idsenha" required minlength="8" maxlength="12" size="12" placeholder="Digite a sua senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
