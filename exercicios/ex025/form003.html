<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="get">

        <p>

            <label for="idnome">Nome</label>
            <input type="text" name="nome" id="idnome" required maxlength="30" placeholder="Nome completo" autocomplete="name" required>
        </p>
        <p>
           <label for="idmedia">Media</label>
           <input type="number" name="media" id="idmedia" min="0" max="10" step="0.1" required> 
        </p>

        <p>
            <label for="idmes">Periodo Letivo</label>
            <input type="month" name="mes" id="idmes">
        </p>

        <p>
            <label for="iddia">dia da prova</label>
            <input type="date" name="dia" id="iddia">
        </p>

        <p>
            <label for="idhora">Horario da prova</label>
            <input type="time" name="hora" id="idhora">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
