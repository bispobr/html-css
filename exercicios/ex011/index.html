<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia html5</title>
</head>
<body>
    <h1>imagens dinamicas</h1>
    <p>Abra essa pagina em varios dispositivos ou aumente ou diminua o tamanho do navegador</p>
    <picture>
        <source media="(max-width:800px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1000px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem Flexivel">
    </picture>
    <h1> Reproduzondo audio</h1>
    <p>Aprendendo a reproduzir audio em HTML5</p>
    <audio src="media/Hotlanta - Track Tribe.mp3" controls autoplay></audio>
</body>
</html>
