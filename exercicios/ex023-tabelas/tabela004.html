<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        table{
            width: 200px;
            border-collapse: collapse;
        }
        td , th{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col" >Nomes</th>
                <th colspan="3" scope="colgroup">filmes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td >Ana Maria santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>

            <tr>
                <td >Beatriz Souza</td>
                <td>Hulk</td>
                <td>inception</td>
                <td>batman</td>
            </tr>

            <tr>
                <td >claudia Melo</td>
                <td>oblivion</td>
                <td>matrix</td>
                <td>big hero</td>
            </tr>

            <tr>
                <th rowspan="3" scope="rowgroup">homens</th>
                <td >Bruno mendonça</td>
                <td>intocaveis</td>
                <td>amnésia</td>
                <td>gladiador</td>
            </tr>

            <tr>
                <td >Daniel Lourenço</td>
                <td>wall-e</td>
                <td>oldboy</td>
                <td>bdangal</td>
            </tr>

            <tr>
                <td >fabiano</td>
                <td>start wars 5</td>
                <td>taxi drive</td>
                <td>toy story </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
