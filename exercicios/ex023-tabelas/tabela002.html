<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        table {
            width:250px;
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        thead, tfoot {
            background-color: gray;
            color: white;
        }
        tbody > tr:nth-child(2n) { /* Efeito zebrado */
            background-color: lightgray;
        }
        td.num{
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas Grandes</h1>
    <table>
        <caption>População estados</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">população</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>AA</td>
                <td class="num">45.254.25</td>
            </tr>
            <tr>
                <td>BB</td>
                <td class="num">15.00.254</td>
            </tr>
            <tr>
                <td>CC</td>
                <td class="num">22.254.25</td>
            </tr>

            <tr>
                <td>DD</td>
                <td class="num">5.254.25</td>
            </tr>

            <tr>
                <td>EE</td>
                <td class="num">4.254.25</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de habitantes</th>
                <td class="num">0000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
